networks:
  basic:
    driver: bridge
services:
  postgres:
    platform: linux/amd64
    networks:
      - basic
    image: "postgres:15.4"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=auth_gaurd
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
    volumes:
      - "./docker_volume/postgres:/var/lib/postgresql/data"
    container_name: api-gaurd-postgres


volumes:
  postgres:
